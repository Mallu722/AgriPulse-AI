version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agripulse-backend
    restart: always
    environment:
      - APP_NAME=AgriPulse AI
      - APP_VERSION=0.1.0
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg://agripulse_user:agripulse_secret_pass@db:5432/agripulse_db
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1
      - WEATHER_PRIMARY_PROVIDER=open_meteo
      - WEATHER_FALLBACK_PROVIDER=open_meteo
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agripulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: agripulse-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - agripulse-network

  db:
    image: postgres:16-alpine
    container_name: agripulse-postgres
    restart: always
    environment:
      POSTGRES_USER: agripulse_user
      POSTGRES_PASSWORD: agripulse_secret_pass
      POSTGRES_DB: agripulse_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agripulse_user -d agripulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agripulse-network

volumes:
  postgres_data:
    driver: local

networks:
  agripulse-network:
    driver: bridge
