# Render Blueprint specification for AgriPulse AI
services:
  # Backend FastAPI Service
  - type: web
    name: agripulse-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: AgriPulse AI
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agripulse-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: agripulse-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

# Managed PostgreSQL Database
databases:
  - name: agripulse-db
    databaseName: agripulse
    user: agripulse_user
    plan: free
